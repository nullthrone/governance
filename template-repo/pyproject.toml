[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{PROJECT_NAME}}"
version = "0.0.0"
description = "{{PROJECT_NAME}}"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
{{PROJECT_NAME}} = "{{PACKAGE}}.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE}}"]

[tool.ruff]
line-length = 120
