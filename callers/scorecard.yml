# Managed by nullthrone/governance. Do not edit: changes come only from the owner via onboarding.
# OpenSSF Scorecard for public repositories. Not a thin caller: scorecard-action has to run in the
# repository's own workflow to publish results (badge).
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 2"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
