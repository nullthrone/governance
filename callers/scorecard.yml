# Managed by nullthrone/governance. Do not edit: changes come only from the owner via onboarding.
# OpenSSF Scorecard for public repositories. Not a thin caller: scorecard-action has to run in the
# repository's own workflow to publish results (badge).
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 2"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
