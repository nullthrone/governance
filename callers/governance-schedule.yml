# Managed by nullthrone/governance. Do not edit: changes come only from the owner via onboarding.
# Times in UTC. Nightly 02:17, weekly Monday 03:37, monthly on the 1st 04:57.
name: governance-schedule
on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "37 3 * * 1"
    - cron: "57 4 1 * *"
  workflow_dispatch:
    inputs:
      task:
        description: Run a single housekeeping task
        type: choice
        options: [roadmap, fork-prequal, fork-adopt, deps, dead-code, flaky, doc-drift, web-checks, deprecations, security-sweep, ideas, audit, cleanup, fuzz, labels]
permissions: {}
jobs:
  housekeeping:
    if: github.event_name == 'schedule' || inputs.task != 'labels'
    uses: nullthrone/governance/.github/workflows/housekeeping.yml@__GOVERNANCE_SHA__
    with:
      task: ${{ inputs.task || '' }}
    permissions:
      contents: read
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GOVERNANCE_APP_PRIVATE_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  labels:
    if: github.event.schedule == '37 3 * * 1' || inputs.task == 'labels'
    uses: nullthrone/governance/.github/workflows/label-sync.yml@__GOVERNANCE_SHA__
    permissions:
      contents: read
      issues: write
