# Managed by nullthrone/governance. Do not edit: changes come only from the owner via onboarding.
# Also handles PR labels that route items to the owner's PO inbox.
name: governance-issues
on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [labeled]
permissions: {}
jobs:
  po-ready:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'po:ready'
    uses: nullthrone/governance/.github/workflows/po-ready-gate.yml@__GOVERNANCE_SHA__
    permissions:
      contents: read
      issues: write
  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    uses: nullthrone/governance/.github/workflows/triage.yml@__GOVERNANCE_SHA__
    permissions:
      contents: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GOVERNANCE_APP_PRIVATE_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
  inbox:
    if: github.event.action == 'labeled' && contains(fromJSON('["po:decision","po:review"]'), github.event.label.name)
    uses: nullthrone/governance/.github/workflows/po-inbox.yml@__GOVERNANCE_SHA__
    with:
      node_id: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
    permissions:
      contents: read
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
