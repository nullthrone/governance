# User documentation.
#   mode preview  (push to next)  build docs and upload them as artifact `docs-preview`
#   mode publish  (release on main) build docs for the tag, translate into the software's locales,
#                 publish to GitHub Pages. Docs never run ahead of released features.
# Projects without a docs site (docs.site: false) keep docs in the README; nothing is published.
name: docs
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      version:
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      GOVERNANCE_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      site: ${{ steps.profile.outputs.docs_site }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.mode == 'publish' && inputs.version || github.sha }}
          persist-credentials: false
      - name: Checkout governance (pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-src
          persist-credentials: false
      - name: Move governance tooling out of the workspace
        run: mv .governance-src "$RUNNER_TEMP/gov" && echo "GOV=$RUNNER_TEMP/gov" >> "$GITHUB_ENV"
      - name: Read profile
        id: profile
        run: |
          python3 "$GOV/scripts/profile.py" outputs
          {
            echo "output=$(python3 "$GOV/scripts/profile.py" get docs.output --default site)"
            echo "source=$(python3 "$GOV/scripts/profile.py" get docs.source --default docs)"
            echo "i18n=$(python3 "$GOV/scripts/profile.py" get docs.i18n_dir --default docs/i18n)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.profile.outputs.docs_site == 'true'
        with:
          python-version: ${{ steps.profile.outputs.language == 'python' && steps.profile.outputs.runtime_version || '3.12' }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.profile.outputs.docs_site == 'true' && (steps.profile.outputs.language == 'node' || steps.profile.outputs.is_web == 'true')
        with:
          node-version: ${{ steps.profile.outputs.language == 'node' && steps.profile.outputs.runtime_version || '22' }}
      - name: Setup
        if: steps.profile.outputs.docs_site == 'true'
        run: python3 "$GOV/scripts/profile.py" run commands.setup --allow-missing
      - name: Screenshots (Playwright) and terminal recordings
        if: steps.profile.outputs.docs_site == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: python3 "$GOV/scripts/profile.py" run commands.screenshots --allow-missing --env "VERSION=$VERSION"

      - name: Translation token (read-only)
        if: steps.profile.outputs.docs_site == 'true' && inputs.mode == 'publish' && steps.profile.outputs.docs_locales != '[]'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Build translation prompt
        if: steps.app.outcome == 'success'
        id: prompt
        env:
          LOCALES: ${{ steps.profile.outputs.docs_locales }}
          SOURCE: ${{ steps.profile.outputs.source }}
          TARGET: ${{ steps.profile.outputs.i18n }}
        run: |
          python3 "$GOV/scripts/build_prompt.py" --job translate-docs --agent doc-writer --tier medium \
            --var "source_dir=$SOURCE" --var "target_dir=$TARGET" --var "locales=$(jq -r 'join(", ")' <<<"$LOCALES")"
      - name: Claude translates docs
        if: steps.app.outcome == 'success'
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.prompt.outputs.model }}
            --plugin-dir ${{ env.GOV }}/plugins/governance
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,LS"

      - name: Build docs
        if: steps.profile.outputs.docs_site == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: python3 "$GOV/scripts/profile.py" run docs.build --env "VERSION=$VERSION"
      - name: Upload preview
        if: steps.profile.outputs.docs_site == 'true' && inputs.mode != 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: ${{ steps.profile.outputs.output }}
          retention-days: 30
      - name: Upload Pages artifact
        if: steps.profile.outputs.docs_site == 'true' && inputs.mode == 'publish'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ steps.profile.outputs.output }}

  deploy:
    name: deploy-pages
    needs: build
    if: inputs.mode == 'publish' && needs.build.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5