# Synchronizes the label taxonomy from labels.yml into the calling repository.
# Labels not in the taxonomy are left alone unless they collide by name.
name: label-sync
on:
  workflow_call: {}

permissions: {}

jobs:
  label-sync:
    name: label-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout governance (pinned)
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-src
          persist-credentials: false
      - name: Move governance tooling out of the workspace
        run: mv .governance-src "$RUNNER_TEMP/gov" && echo "GOV=$RUNNER_TEMP/gov" >> "$GITHUB_ENV"
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GOV/scripts/sync_labels.py" --repo "$GITHUB_REPOSITORY"
