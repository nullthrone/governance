# Issue triage with a small model. Token limited to issues; issue text is data.
name: triage
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GOVERNANCE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  triage:
    name: triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Checkout governance (pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-src
          persist-credentials: false
      - name: Move governance tooling out of the workspace
        run: mv .governance-src "$RUNNER_TEMP/gov" && echo "GOV=$RUNNER_TEMP/gov" >> "$GITHUB_ENV"
      - name: Issues-only token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Build prompt
        id: prompt
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: python3 "$GOV/scripts/build_prompt.py" --job triage --agent triager --tier small --var "issue=$ISSUE" --var "repo=$GITHUB_REPOSITORY"
      - name: Claude triage
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_non_write_users: "*"
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.prompt.outputs.model }}
            --plugin-dir ${{ env.GOV }}/plugins/governance
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh search issues:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"
