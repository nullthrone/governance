# Pushes org-dotgithub/ into the .github repository of every organization in config/governance.json.
# Deterministic, no model. Needs the governance app installed on each organization (contents:write
# on the .github repository); see docs/MANUAL-STEPS.md.
name: self-sync-org-dotgithub
on:
  push:
    branches: [main]
    paths: ["org-dotgithub/**", "config/governance.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.orgs.outputs.orgs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: orgs
        run: echo "orgs=$(jq -c .organizations config/governance.json)" >> "$GITHUB_OUTPUT"

  sync:
    name: sync ${{ matrix.org }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.plan.outputs.orgs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: App token for the organization's .github repository
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: .github
      - name: Checkout .github repository
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.org }}/.github
          token: ${{ steps.app.outputs.token }}
          path: target
      - name: Render and push
        env:
          ORG: ${{ matrix.org }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          python3 scripts/sync_org_dotgithub.py --org "$ORG" --target-dir target
          cd target
          if [ -z "$(git status --porcelain)" ]; then echo "unchanged"; exit 0; fi
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync community health files from nullthrone/governance@${GITHUB_SHA::12}"
          git push
