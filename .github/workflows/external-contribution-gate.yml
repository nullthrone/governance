# external-contribution-gate: PRs from authors other than the owner and the governance bots stay red
#   until the owner approves them (a roadmap decision, not a code review).
# candidate-approval: the candidate PR next -> main stays red until the owner approves its current head.
name: external-contribution-gate
on:
  workflow_call: {}

permissions: {}

jobs:
  external-contribution-gate:
    name: external-contribution-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout governance (pinned)
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-src
          persist-credentials: false
      - name: Move governance tooling out of the workspace
        run: mv .governance-src "$RUNNER_TEMP/gov" && echo "GOV=$RUNNER_TEMP/gov" >> "$GITHUB_ENV"
      - name: Check author and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GOV/scripts/checks.py" gate

  candidate-approval:
    name: candidate-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout governance (pinned)
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-src
          persist-credentials: false
      - name: Move governance tooling out of the workspace
        run: mv .governance-src "$RUNNER_TEMP/gov" && echo "GOV=$RUNNER_TEMP/gov" >> "$GITHUB_ENV"
      - name: Check owner acceptance of the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GOV/scripts/checks.py" candidate-approval
